# Copy to config/config.yaml and edit. Every value here is optional; the
# collector runs with sensible defaults when no config file exists.

database: ./data/massive.db

workers: 8
batch_size: 10000
timeout: 60s
max_retries: 4
# Global requests/second ceiling. 0 means unlimited; sources can be stricter.
rate_limit: 0

sqlite:
  cache_size_kb: 65536
  mmap_size_mb: 256
  busy_timeout: 30s
  max_conns: 4

sources:
  test:
    enabled: false
    count: 100000

  rss:
    enabled: true
    feeds_file: ./config/feeds.txt
    workers: 16
    max_feed_bytes: 33554432

  gdelt:
    enabled: true
    # latest   - the newest 15-minute files
    # backfill - walk the master file list from --since forward
    mode: latest
    datasets: [export, mentions]
    max_files: 0

  github:
    enabled: true
    # Secrets never belong in this file.
    token: ${GITHUB_TOKEN}
    # repositories - enumerate every public repository (REST, resumable by id)
    # events       - the public event stream (REST, ETag conditional)
    # repo_details - star/fork/language snapshots (GraphQL, needs a token)
    datasets: [repositories, events]
    # Pages of 100 repositories per run; 0 keeps going until the API runs out.
    max_pages: 20
    event_pages: 3
    store_payload: true
    # repo_details: repositories per run, and how long a snapshot stays fresh.
    detail_batch: 1000
    detail_workers: 4
    refresh_after: 168h
    # Topics cost one extra GraphQL point per topic per 100 repositories.
    topics: 0

  commoncrawl:
    enabled: false
    # A crawl id such as CC-MAIN-2026-34, or "latest" to use the newest one.
    crawl: latest
    # index - stream CDX shards (billions of rows per crawl, cheap to parse)
    # pages - fetch documents from WARC by ranged request (one request each)
    datasets: [index]
    # A crawl has 300 shards of roughly 1 GB each. Keep runs bounded.
    max_shards: 1
    shard_count: 300
    checkpoint_lines: 50000
    # pages settings
    page_batch: 500
    page_workers: 8
    page_mime: text/html
    collect_links: true
    # Storing extracted text multiplies storage; length is always recorded.
    store_text: false
    text_limit: 4096
